<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>알라딘 중고책 매장 찾기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 style="cursor:pointer;" onclick="location.reload()">알라딘 중고책 매장 찾기</h1>
      <p class="subtitle">2만원 이상 무료배송!!!</p>
    </header>

    <main class="main-layout">
      <!-- 메인 컨텐츠 영역 (PC 좌측, 모바일 세로 배치) -->
      <div class="content-column">
        <section class="search-section" id="section-search">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="책 제목을 입력하세요" />
            <button id="searchBtn">검색</button>
          </div>
          <div id="searchResults" class="search-results"></div>
        </section>

        <!-- 모바일에서는 카트(담은 책)가 여기에 보일 수도 있지만, CSS 플로팅 바를 사용하므로 
             본문 내에는 간략히 보여주거나 숨길 수 있습니다. 기본적으로 모바일에서도 본문에 보이게 둡니다. -->
        <div class="mobile-cart-placeholder"></div>

        <section class="result-section" id="section-stores">
          <h2>매장 결과</h2>
          <div id="storeResults" class="store-results"></div>
        </section>

      </div>

      <!-- 사이드바 카트 영역 (PC 우측 고정, 모바일에서는 본문 중간이나 하단에 표시) -->
      <div class="sidebar-column" id="sidebarCart">
        <div class="sticky-cart">
          <section class="selected-section" id="section-selected">
            <h2>담은 책 (최대 3권)</h2>
            <div id="selectedBooks" class="selected-books">
              <p class="empty-message">검색 결과에서 책을 선택해주세요</p>
            </div>
            <div class="selected-info">
              <p>선택: <span id="selectedCount">0</span>/3</p>
              <p>예상 중고가: 약 <span id="totalPrice">0</span>원</p>
            </div>
            <button id="findStoresBtn" class="find-stores-btn" disabled>매장 찾기</button>
            <button id="saveQueryBtn" class="save-query-btn" disabled>조합 저장하기</button>
          </section>

          <section class="saved-section" id="section-saved">
            <h2>다시 찾기 <span class="saved-count" id="savedCount">0/3</span></h2>
            <div id="savedQueries">
              <p class="empty-message">저장된 조합이 없습니다.<br>책을 선택하고 조합을 저장해보세요.</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p>알라딘 Open API와 웹 크롤링을 활용한 서비스입니다</p>
    </footer>
  </div>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loader"></div>
    <p>매장을 검색하는 중입니다...</p>
  </div>

  <!-- 모바일: 바텀 시트 오버레이 -->
  <div id="mobileOverlay" class="mobile-overlay"></div>

  <!-- 모바일: 책 상세 바텀 시트 -->
  <div id="mobileSheet" class="mobile-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-book-preview">
      <img id="sheetCover" src="" alt="">
      <div class="sheet-book-info">
        <h3 id="sheetTitle"></h3>
        <p id="sheetAuthor"></p>
        <p id="sheetPublisher"></p>
        <p id="sheetPrice"></p>
      </div>
    </div>
    <p id="sheetNote" class="sheet-note"></p>
    <a id="sheetLink" href="#" target="_blank" rel="noopener noreferrer" class="sheet-aladin-link">알라딘에서 보기 →</a>
    <div class="sheet-actions">
      <button class="sheet-close-btn" id="sheetCloseBtn">닫기</button>
      <button class="sheet-add-btn" id="sheetAddBtn">담기</button>
    </div>
  </div>

  <!-- 모바일: 하단 고정 바 -->
  <div id="mobileBottomBar" class="mobile-bottom-bar">
    <div class="mobile-bottom-bar-info">
      <div class="mobile-bottom-chips-wrap">
        <div id="mobileBottomChips" class="mobile-bottom-chips"></div>
        <span class="mobile-bottom-hint">3권까지 담기 가능</span>
      </div>
      <span id="mobileBottomTotal" class="mobile-bottom-total">합계 0원</span>
    </div>
    <button id="mobileBottomSaveBtn" class="mobile-bottom-save-btn" style="display:none">이 조합 저장하기</button>
    <button id="mobileBottomFindBtn" class="mobile-bottom-find-btn" disabled>책을 선택해주세요</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
