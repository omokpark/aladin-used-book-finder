<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알라딘 중고책 매장 찾기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>알라딘 중고책 매장 찾기</h1>
      <p class="subtitle">무료 묶음배송 가능한 매장 찾기</p>
    </header>

    <main class="main-layout">
      <!-- 메인 컨텐츠 영역 (PC 좌측, 모바일 세로 배치) -->
      <div class="content-column">
        <section class="search-section" id="section-search">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="책 제목을 입력하세요" />
            <button id="searchBtn">검색</button>
          </div>
          <div id="searchResults" class="search-results"></div>
        </section>

        <!-- 모바일에서는 카트(담은 책)가 여기에 보일 수도 있지만, CSS 플로팅 바를 사용하므로 
             본문 내에는 간략히 보여주거나 숨길 수 있습니다. 기본적으로 모바일에서도 본문에 보이게 둡니다. -->
        <div class="mobile-cart-placeholder"></div>

        <section class="result-section" id="section-stores">
          <h2>매장 결과</h2>
          <div id="storeResults" class="store-results">
            <p class="empty-message">책을 담고 매장 찾기 버튼을 눌러주세요</p>
          </div>
        </section>

      </div>

      <!-- 사이드바 카트 영역 (PC 우측 고정, 모바일에서는 본문 중간이나 하단에 표시) -->
      <div class="sidebar-column" id="sidebarCart">
        <div class="sticky-cart">
          <section class="selected-section" id="section-selected">
            <h2>담은 책 (최대 3권)</h2>
            <div id="selectedBooks" class="selected-books">
              <p class="empty-message">검색 결과에서 책을 선택해주세요</p>
            </div>
            <div class="selected-info">
              <p>선택: <span id="selectedCount">0</span>/3</p>
              <p>합계: <span id="totalPrice">0</span>원</p>
            </div>
            <button id="findStoresBtn" class="find-stores-btn" disabled>매장 찾기</button>
            <button id="saveQueryBtn" class="save-query-btn" disabled>조합 저장하기</button>
          </section>

          <section class="saved-section" id="section-saved">
            <h2>다시 찾기 <span class="saved-count" id="savedCount">0/3</span></h2>
            <div id="savedQueries">
              <p class="empty-message">저장된 조합이 없습니다.<br>책을 선택하고 조합을 저장해보세요.</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <p>알라딘 Open API와 웹 크롤링을 활용한 서비스입니다</p>
    </footer>
  </div>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loader"></div>
    <p>매장을 검색하는 중입니다...</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
